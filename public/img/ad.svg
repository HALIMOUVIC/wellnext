<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Steel Body Horizontal Gradient -->
    <linearGradient id="bodySteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a889b"/>
      <stop offset="30%" stop-color="#bcc8d8"/>
      <stop offset="65%" stop-color="#8a99ac"/>
      <stop offset="100%" stop-color="#556272"/>
    </linearGradient>

    <!-- Top Cap Ellipse Gradient -->
    <linearGradient id="topPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c6d2e2"/>
      <stop offset="100%" stop-color="#8493a6"/>
    </linearGradient>

    <!-- Flange Rim Highlight -->
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a2b4"/>
      <stop offset="30%" stop-color="#eaf0f8"/>
      <stop offset="65%" stop-color="#98a8bc"/>
      <stop offset="100%" stop-color="#5e6d7e"/>
    </linearGradient>

    <!-- Hex Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6edf6"/>
      <stop offset="100%" stop-color="#738294"/>
    </linearGradient>

    <!-- Badge Steel Radial Gradient -->
    <radialGradient id="badgeSteel" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#b6c4d4"/>
      <stop offset="55%" stop-color="#728092"/>
      <stop offset="100%" stop-color="#3d4957"/>
    </radialGradient>
  </defs>

  <!-- ================= 1. LOWER CASING CYLINDER ================= -->
  <g stroke="#333f4d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Casing Tube -->
    <path fill="url(#bodySteel)" d="
      M 48,96 
      L 48,154 
      C 48,168 76,176 110,176 
      C 144,176 172,168 172,154 
      L 172,96 
      Z
    "/>

    <!-- Base Shadow Seam -->
    <path fill="none" stroke="#252f3a" stroke-width="2" d="M 48,154 C 48,168 76,176 110,176 C 144,176 172,168 172,154"/>

    <!-- ================= 2. LOWER MATING FLANGE ================= -->
    <path fill="url(#rimHighlight)" d="
      M 28,78 
      L 28,96 
      C 28,110 65,118 110,118 
      C 155,118 192,110 192,96 
      L 192,78 
      C 192,92 155,100 110,100 
      C 65,100 28,92 28,78 
      Z
    "/>

    <!-- Lower Flange Hex Nut Studs -->
    <!-- Left Nut -->
    <path fill="url(#boltGrad)" d="M 34,92 L 44,88 L 44,97 L 34,101 Z"/>
    <!-- Center-Left Nut -->
    <path fill="url(#boltGrad)" d="M 64,101 L 76,98 L 76,108 L 64,111 Z"/>
    <!-- Center-Right Nut -->
    <path fill="url(#boltGrad)" d="M 124,101 L 136,98 L 136,108 L 124,111 Z"/>
    <!-- Right Nut -->
    <path fill="url(#boltGrad)" d="M 158,92 L 168,88 L 168,97 L 158,101 Z"/>

    <!-- Gasket Gap Line -->
    <ellipse cx="110" cy="78" rx="82" ry="21" fill="#252f3a"/>

    <!-- ================= 3. UPPER BLIND FLANGE (SOLID CAP) ================= -->
    <!-- Cap Side Profile -->
    <path fill="url(#rimHighlight)" d="
      M 28,50 
      L 28,76 
      C 28,90 65,98 110,98 
      C 155,98 192,90 192,76 
      L 192,50 
      Z
    "/>

    <!-- Cap Top Flat Face -->
    <ellipse cx="110" cy="50" rx="82" ry="21" fill="url(#topPlate)"/>

    <!-- Top Cap Bevel Edge -->
    <ellipse cx="110" cy="49" rx="76" ry="19" fill="none" stroke="#eaf0f8" stroke-width="1.5" opacity="0.8"/>

    <!-- ================= 4. UPPER STUD BOLTS (HEX HEADS) ================= -->
    <!-- Top Row (Rear Arc) -->
    <!-- Far Left -->
    <path fill="url(#boltGrad)" d="M 40,36 L 49,32 L 56,36 L 56,43 L 47,47 L 40,43 Z"/>
    <!-- Mid Left -->
    <path fill="url(#boltGrad)" d="M 80,27 L 89,24 L 96,27 L 96,34 L 87,37 L 80,34 Z"/>
    <!-- Mid Right -->
    <path fill="url(#boltGrad)" d="M 124,27 L 133,24 L 140,27 L 140,34 L 131,37 L 124,34 Z"/>
    <!-- Far Right -->
    <path fill="url(#boltGrad)" d="M 164,36 L 173,32 L 180,36 L 180,43 L 171,47 L 164,43 Z"/>

    <!-- Bottom Row (Front Arc) -->
    <!-- Front Left -->
    <path fill="url(#boltGrad)" d="M 68,48 L 78,44 L 88,48 L 88,57 L 78,61 L 68,57 Z"/>
    <!-- Front Right -->
    <path fill="url(#boltGrad)" d="M 132,48 L 142,44 L 152,48 L 152,57 L 142,61 L 132,57 Z"/>
  </g>

  <!-- ================= 5. METALLIC 'X' BADGE (SHUT-IN / TERMINATION) ================= -->
  <g transform="translate(142, 146)">
    <!-- Circular Steel Medallion -->
    <circle cx="0" cy="0" r="34" fill="url(#badgeSteel)" stroke="#232d38" stroke-width="3"/>
    <circle cx="0" cy="0" r="31" fill="none" stroke="#d5e0ee" stroke-width="1.5" opacity="0.6"/>

    <!-- Metallic 'X' Glyph -->
    <path d="
      M -15,-9 L -9,-15 L 0,-6 L 9,-15 L 15,-9 L 6,0 L 15,9 L 9,15 L 0,6 L -9,15 L -15,9 L -6,0 Z
    " fill="#f1f5f9" stroke="#232d38" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
