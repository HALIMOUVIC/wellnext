<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <!-- Metallic Purple Cylinder Gradient (Vertical Highlights & Shadow) -->
    <linearGradient id="purpleMetalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d6b"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="45%" stop-color="#e9d5ff"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Side Sensor / Conduit Metallic Gradient -->
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter for Industrial Depth -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2e1065" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#purpleGlow)" stroke="#240742" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- ================= 1. RIGHT SIDE PROBE / SENSOR ANTENNA ================= -->
    <rect x="108" y="44" width="14" height="96" rx="7" fill="url(#sensorGrad)"/>
    <line x1="112" y1="48" x2="112" y2="134" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

    <!-- ================= 2. TOP CAP & NECK ASSEMBLY ================= -->
    <!-- Top Cap Bushing -->
    <rect x="56" y="38" width="34" height="14" rx="3" fill="url(#purpleMetalGrad)"/>

    <!-- Stepped Neck Ring -->
    <rect x="50" y="50" width="46" height="16" rx="3" fill="url(#purpleMetalGrad)"/>

    <!-- ================= 3. MAIN SENSOR / ACTUATOR BODY ================= -->
    <!-- Main Cylinder Block -->
    <rect x="36" y="64" width="74" height="78" rx="6" fill="url(#purpleMetalGrad)"/>

    <!-- Longitudinal Surface Specular Line -->
    <line x1="68" y1="68" x2="68" y2="138" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- ================= 4. GAUGE / GRILLE ENGRAVINGS ================= -->
    <!-- Left Engraved Scale / Level Indicator -->
    <path d="
      M 48,90 H 64
      M 51,97 H 61
      M 48,104 H 64
      M 51,111 H 61
      M 46,118 H 66
      M 56,90 V 118
    " stroke="#240742" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Right Horizontal Level Slots -->
    <line x1="74" y1="90" x2="86" y2="90" stroke="#240742" stroke-width="2.5"/>
    <line x1="74" y1="96" x2="86" y2="96" stroke="#240742" stroke-width="2.5"/>
    <line x1="74" y1="102" x2="86" y2="102" stroke="#240742" stroke-width="2.5"/>
    <line x1="74" y1="108" x2="86" y2="108" stroke="#240742" stroke-width="2.5"/>
    <line x1="74" y1="114" x2="84" y2="114" stroke="#240742" stroke-width="2.5"/>
    <circle cx="76" cy="120" r="1.5" fill="#240742" stroke="none"/>

    <!-- ================= 5. BASE FLANGE & CONNECTOR PORTS ================= -->
    <!-- Lower Body Base Collar -->
    <rect x="42" y="140" width="62" height="22" rx="4" fill="url(#purpleMetalGrad)"/>

    <!-- Left Connection Port / Pin -->
    <rect x="52" y="160" width="16" height="12" rx="3" fill="url(#purpleMetalGrad)"/>

    <!-- Right Connection Port / Pin -->
    <rect x="78" y="160" width="16" height="12" rx="3" fill="url(#purpleMetalGrad)"/>

  </g>
</svg>
