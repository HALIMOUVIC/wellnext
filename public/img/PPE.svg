<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Water Drop Radial Gradient -->
    <radialGradient id="dropGradSmall" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e0faff"/>
      <stop offset="35%" stop-color="#38e1ff"/>
      <stop offset="75%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </radialGradient>

    <!-- Metallic Cyan Pipe Gradient -->
    <linearGradient id="pipeCyanGradSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="30%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#0096c7"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>

    <!-- Pipe Elbow Curved Gradient -->
    <radialGradient id="elbowGradSmall" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="40%" stop-color="#00c4e8"/>
      <stop offset="80%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#03045e"/>
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="waterShadowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#023e8a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#waterShadowSmall)" stroke="#032b43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- ================= 1. SCALED-DOWN WATER DROPLET ================= -->
    <g transform="translate(80, 52) scale(0.68) translate(-80, -55)">
      <path fill="url(#dropGradSmall)" d="
        M 80,16
        C 80,16 57,51 57,69
        C 57,82 67,93 80,93
        C 93,93 103,82 103,69
        C 103,51 80,16 80,16
        Z
      "/>

      <!-- Specular Highlight Curve on Droplet -->
      <path d="M 68,64 C 67,52 75,34 78,27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- ================= 2. WATER PIPE SPOUT / ELBOW ASSEMBLY ================= -->
    <!-- Left Flange -->
    <rect x="29" y="80" width="16" height="52" rx="4" fill="url(#pipeCyanGradSmall)"/>
    <line x1="33" y1="84" x2="33" y2="128" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

    <!-- Flange Neck Collar -->
    <path d="M 45,89 H 55 V 123 H 45 Z" fill="url(#pipeCyanGradSmall)"/>

    <!-- Horizontal Pipe with 90-Degree Downward Elbow Spout -->
    <path fill="url(#elbowGradSmall)" d="
      M 55,93
      H 96
      C 114,93 128,107 128,125
      V 134
      H 102
      V 125
      C 102,121 99,118 95,118
      H 55
      Z
    "/>

    <!-- Top Highlight Line on Horizontal Spout Section -->
    <path d="M 55,96 H 96 C 111,96 123,107 124,122" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.7"/>

    <!-- Bottom Spout Outlet Rim Collar -->
    <rect x="100" y="133" width="30" height="12" rx="3" fill="url(#pipeCyanGradSmall)"/>
    <line x1="102" y1="136" x2="128" y2="136" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

  </g>
</svg>
