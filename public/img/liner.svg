<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <!-- Solid body filling 100% of width and height from edge to edge -->
  <rect x="0" y="0" width="100" height="140" fill="#000000" stroke="#000000" stroke-width="0"/>

  <!-- Crisp white bowtie / hourglass symbol (standard liner hanger convention) -->
  <polygon points="10,12 90,12 10,128 90,128" fill="#ffffff" stroke="none"/>
</svg>
