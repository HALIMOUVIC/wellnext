<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 750" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="metalBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a8ea3"/><stop offset="50%" stop-color="#e6edf3"/><stop offset="100%" stop-color="#7a8ea3"/>
    </linearGradient>
    <linearGradient id="rubberDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a2a"/><stop offset="50%" stop-color="#484848"/><stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
  </defs>

  <g stroke="#333" stroke-width="1">
    
    <!-- Upper Assembly -->
    <g id="upper-assembly" transform="translate(0, -50)">
      <rect x="128" y="65" width="44" height="80" fill="url(#metalBlue)"/>
      <rect x="122" y="125" width="56" height="45" fill="url(#metalBlue)"/>
      <polygon points="40,170 260,170 260,220 40,220" fill="url(#metalBlue)"/>
      <polygon points="40,220 260,220 260,240 40,240" fill="#5c6b78"/>
      <rect x="60" y="240" width="180" height="50" fill="url(#metalBlue)"/>
    </g>

    <!-- Rubber Packing Bands -->
    <g id="band-1"><rect x="20" y="245" width="260" height="100" rx="4" fill="url(#rubberDark)"/></g>
    <g id="band-2"><rect x="20" y="350" width="260" height="100" rx="4" fill="url(#rubberDark)"/></g>
    <g id="band-3"><rect x="20" y="455" width="260" height="90" rx="4" fill="url(#rubberDark)"/></g>

    <!-- Lower Assembly -->
    <g id="lower-assembly" transform="translate(0, 50)">
      <rect x="60" y="500" width="180" height="50" fill="url(#metalBlue)"/>
      <polygon points="40,550 260,550 260,575 40,575" fill="#5c6b78"/>
      <polygon points="40,575 260,575 260,595 40,595" fill="url(#metalBlue)"/>
      <rect x="126" y="595" width="48" height="50" fill="url(#metalBlue)"/>
      <rect x="130" y="645" width="40" height="50" fill="url(#metalBlue)"/>
    </g>
    
  </g>
</svg>
