<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 780" width="100%" height="100%">
  <defs>
    <!-- Background Shadow -->
    <filter id="equipShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#180408" flood-opacity="0.35"/>
    </filter>

    <!-- Glossy Industrial Red Cylindrical Gradient -->
    <linearGradient id="redCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="15%" stop-color="#b91c1c"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="48%" stop-color="#fca5a5"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#581010"/>
    </linearGradient>

    <!-- Red Flange Bevel Edge Gradient -->
    <linearGradient id="redFlangeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#601111"/>
      <stop offset="20%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="80%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Gray Valve Bonnet Round Cap (Radial Gradient) -->
    <radialGradient id="grayCapGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="95%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>

    <!-- Stainless / Chrome Hardware & Nameplate Gradient -->
    <linearGradient id="chromePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Dark Charcoal Valve Handwheel Gradient -->
    <radialGradient id="darkWheelGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Heavy Hex Nut Pattern Component -->
    <g id="heavyNut">
      <rect x="-6" y="-7" width="12" height="14" rx="2" fill="url(#redFlangeEdge)" stroke="#450a0a" stroke-width="1.2"/>
      <line x1="-2" y1="-6" x2="-2" y2="6" stroke="#fca5a5" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- Reusable Valve Handwheel Component -->
    <g id="valveHandwheelUnit">
      <!-- Gray Actuator Bonnet Cap -->
      <ellipse cx="0" cy="0" rx="28" ry="24" fill="url(#grayCapGrad)" stroke="#334155" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="16" ry="13" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#334155"/>

      <!-- Vertical Stem & Yoke Bracket -->
      <path d="M -6,-18 L -4,-42 L 4,-42 L 6,-18 Z" fill="url(#chromePlate)" stroke="#334155" stroke-width="1.5"/>
      <line x1="0" y1="-20" x2="0" y2="-42" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Oval Perspective Handwheel Mounted on Top -->
      <g transform="translate(0, -42)">
        <ellipse cx="0" cy="0" rx="46" ry="15" fill="none" stroke="url(#darkWheelGrad)" stroke-width="4.5"/>
        <ellipse cx="-1" cy="-1" rx="45" ry="14" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
        <ellipse cx="0" cy="0" rx="7" ry="3.5" fill="url(#darkWheelGrad)" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="0" y2="-15" stroke="#0f172a" stroke-width="2.8"/>
        <line x1="0" y1="0" x2="42" y2="-5" stroke="#0f172a" stroke-width="2.8"/>
        <line x1="0" y1="0" x2="26" y2="12" stroke="#0f172a" stroke-width="2.8"/>
        <line x1="0" y1="0" x2="-26" y2="12" stroke="#0f172a" stroke-width="2.8"/>
        <line x1="0" y1="0" x2="-42" y2="-5" stroke="#0f172a" stroke-width="2.8"/>
      </g>
    </g>
  </defs>

  <g filter="url(#equipShadow)" stroke="#450a0a" stroke-linecap="round" stroke-linejoin="round">

    <!-- ================= 1. TOP SWAB VALVE ASSEMBLY ================= -->
    <g transform="translate(325, 126)">
      <!-- Swab Valve Red Body -->
      <rect x="-24" y="-30" width="48" height="42" rx="3" fill="url(#redCylinder)" stroke-width="2"/>
      
      <!-- Topmost Handwheel -->
      <g transform="translate(0, -12)">
        <use href="#valveHandwheelUnit"/>
      </g>
      
      <!-- Flange joint seamlessly connected to Cross Block top -->
      <rect x="-38" y="10" width="76" height="14" rx="2" fill="url(#redFlangeEdge)" stroke-width="2"/>
      <use href="#heavyNut" x="-28" y="17"/>
      <use href="#heavyNut" x="-10" y="17"/>
      <use href="#heavyNut" x="10" y="17"/>
      <use href="#heavyNut" x="28" y="17"/>
    </g>

    <!-- ================= 2. CENTRAL FLOW CROSS BLOCK ================= -->
    <rect x="285" y="150" width="80" height="96" rx="4" fill="url(#redCylinder)" stroke-width="2.6"/>
    <line x1="295" y1="154" x2="295" y2="242" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
    <rect x="314" y="188" width="22" height="12" rx="1.5" fill="url(#chromePlate)" stroke="#475569" stroke-width="1"/>

    <!-- ================= 3. LEFT PRODUCTION WING VALVE ================= -->
    <g transform="translate(285, 198)">
      <rect x="-42" y="-20" width="42" height="40" fill="url(#redCylinder)" stroke-width="2"/>
      <rect x="-56" y="-28" width="14" height="56" rx="2" fill="url(#redFlangeEdge)" stroke-width="1.8"/>
      
      <rect x="-98" y="-22" width="42" height="44" fill="url(#redCylinder)" stroke-width="2"/>
      <g transform="translate(-76, -4) scale(0.92)">
        <use href="#valveHandwheelUnit"/>
      </g>

      <rect x="-114" y="-30" width="16" height="60" rx="2" fill="url(#redFlangeEdge)" stroke-width="2"/>
      <rect x="-124" y="-24" width="10" height="48" rx="2" fill="url(#redFlangeEdge)" stroke-width="1.8"/>
      <use href="#heavyNut" x="-114" y="-20"/>
      <use href="#heavyNut" x="-114" y="0"/>
      <use href="#heavyNut" x="-114" y="20"/>
    </g>

    <!-- ================= 4. RIGHT KILL WING & CHOKE MANIFOLD BLOCK ================= -->
    <g transform="translate(365, 198)">
      <rect x="0" y="-20" width="40" height="40" fill="url(#redCylinder)" stroke-width="2"/>
      <rect x="40" y="-28" width="14" height="56" rx="2" fill="url(#redFlangeEdge)" stroke-width="1.8"/>

      <rect x="54" y="-22" width="44" height="44" fill="url(#redCylinder)" stroke-width="2"/>
      <g transform="translate(76, -4) scale(0.92)">
        <use href="#valveHandwheelUnit"/>
      </g>

      <rect x="98" y="-26" width="14" height="52" rx="2" fill="url(#redFlangeEdge)" stroke-width="1.8"/>

      <!-- Large Heavy Red Choke Block -->
      <rect x="112" y="-34" width="62" height="68" rx="3" fill="url(#redCylinder)" stroke-width="2.5"/>
      <line x1="120" y1="-30" x2="120" y2="30" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
      <rect x="134" y="-18" width="18" height="10" rx="1.5" fill="url(#chromePlate)" stroke="#475569" stroke-width="1"/>
      <rect x="124" y="-48" width="38" height="14" rx="2" fill="url(#redFlangeEdge)" stroke-width="1.8"/>
      <rect x="116" y="34" width="54" height="16" rx="2" fill="url(#redFlangeEdge)" stroke-width="2"/>
      <use href="#heavyNut" x="126" y="42"/>
      <use href="#heavyNut" x="160" y="42"/>
    </g>

    <!-- ================= 5. UPPER MASTER VALVE ================= -->
    <g transform="translate(325, 276)">
      <!-- Connected directly below cross block -->
      <rect x="-26" y="-30" width="52" height="58" rx="3" fill="url(#redCylinder)" stroke-width="2"/>
      <line x1="-16" y1="-28" x2="-16" y2="24" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>

      <!-- Forward Angled Master Handwheel Unit -->
      <g transform="translate(0, -4)">
        <use href="#valveHandwheelUnit"/>
      </g>
    </g>

    <!-- Seamless Spool Transition Neck into Tubing Spool -->
    <rect x="304" y="304" width="42" height="22" fill="url(#redCylinder)" stroke-width="2"/>
    <line x1="310" y1="305" x2="310" y2="325" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

    <!-- ================= 6. TUBING HEAD / CASING SPOOL SECTION ================= -->
    <g transform="translate(325, 355)">
      <!-- Main Upper Flange Body (Solid, No floating gaps) -->
      <rect x="-82" y="-30" width="164" height="60" rx="5" fill="url(#redCylinder)" stroke-width="2.8"/>
      <line x1="-76" y1="-24" x2="-76" y2="24" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
      <line x1="-82" y1="4" x2="82" y2="4" stroke="#450a0a" stroke-width="2"/>

      <!-- Upper Stud Array -->
      <use href="#heavyNut" x="-66" y="-26"/>
      <use href="#heavyNut" x="-44" y="-26"/>
      <use href="#heavyNut" x="-22" y="-26"/>
      <use href="#heavyNut" x="0" y="-26"/>
      <use href="#heavyNut" x="22" y="-26"/>
      <use href="#heavyNut" x="44" y="-26"/>
      <use href="#heavyNut" x="66" y="-26"/>

      <!-- Lockdown Pins Around Perimeter -->
      <g stroke="#450a0a" stroke-width="1.8" fill="url(#chromePlate)">
        <rect x="-96" y="-10" width="14" height="8" rx="1.5"/>
        <rect x="-88" y="0" width="12" height="7" rx="1"/>
        <rect x="-70" y="4" width="10" height="7" rx="1"/>
        <rect x="-42" y="6" width="10" height="7" rx="1"/>
        <rect x="-14" y="7" width="10" height="7" rx="1"/>
        <rect x="14" y="7" width="10" height="7" rx="1"/>
        <rect x="42" y="6" width="10" height="7" rx="1"/>
        <rect x="70" y="4" width="10" height="7" rx="1"/>
        <rect x="88" y="0" width="12" height="7" rx="1"/>
        <rect x="96" y="-10" width="14" height="8" rx="1.5"/>
      </g>

      <!-- Lower Flange Nuts Seated Flushed with the Lower Cylinder -->
      <use href="#heavyNut" x="-50" y="30"/>
      <use href="#heavyNut" x="-25" y="30"/>
      <use href="#heavyNut" x="0" y="30"/>
      <use href="#heavyNut" x="25" y="30"/>
      <use href="#heavyNut" x="50" y="30"/>
    </g>

    <!-- Lower Annulus Spool Cylinder Seamlessly Attached -->
    <rect x="260" y="390" width="130" height="82" rx="4" fill="url(#redCylinder)" stroke-width="2.6"/>
    <line x1="272" y1="392" x2="272" y2="468" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
    <rect x="314" y="420" width="22" height="14" rx="1.5" fill="url(#chromePlate)" stroke="#475569" stroke-width="1"/>

    <!-- ================= 7. LOWER ANNULUS WING VALVES ================= -->
    <!-- Left Annulus Valve -->
    <g transform="translate(260, 432)">
      <rect x="-46" y="-14" width="46" height="28" fill="url(#redCylinder)" stroke-width="1.8"/>
      <rect x="-62" y="-22" width="16" height="44" rx="2" fill="url(#redFlangeEdge)" stroke-width="1.8"/>
      <g transform="translate(-32, 2) scale(0.82)">
        <use href="#valveHandwheelUnit"/>
      </g>
      <rect x="-84" y="-26" width="22" height="52" rx="2" fill="url(#redFlangeEdge)" stroke-width="2"/>
      <use href="#heavyNut" x="-84" y="-16"/>
      <use href="#heavyNut" x="-84" y="0"/>
      <use href="#heavyNut" x="-84" y="16"/>
    </g>

    <!-- Right Annulus Valve -->
    <g transform="translate(390, 432)">
      <rect x="0" y="-14" width="46" height="28" fill="url(#redCylinder)" stroke-width="1.8"/>
      <rect x="46" y="-22" width="16" height="44" rx="2" fill="url(#redFlangeEdge)" stroke-width="1.8"/>
      <g transform="translate(32, 2) scale(0.82)">
        <use href="#valveHandwheelUnit"/>
      </g>
      <rect x="62" y="-26" width="22" height="52" rx="2" fill="url(#redFlangeEdge)" stroke-width="2"/>
      <use href="#heavyNut" x="72" y="-16"/>
      <use href="#heavyNut" x="72" y="0"/>
      <use href="#heavyNut" x="72" y="16"/>
    </g>

    <!-- ================= 8. CASING HEAD BASE FLANGE (NO DISCONNECTED HOLE) ================= -->
    <g transform="translate(325, 472)">
      <!-- Smooth Solid Base with Slanted Flare -->
      <path d="
        M -65,0
        H 65
        L 94,110
        C 94,118 84,124 74,124
        H -74
        C -84,124 -94,118 -94,110
        Z
      " fill="url(#redCylinder)" stroke-width="2.8"/>
      <line x1="-60" y1="4" x2="-84" y2="110" stroke="#ffffff" stroke-width="3" opacity="0.85"/>

      <!-- Integrated Flange Bevel Joint Line between Spool & Base -->
      <ellipse cx="0" cy="0" rx="65" ry="12" fill="url(#redFlangeEdge)" stroke="#450a0a" stroke-width="2"/>

      <!-- Peripheral Bolt Hole Ring on Base Step -->
      <g fill="#260303" stroke="#450a0a" stroke-width="1.2">
        <ellipse cx="-58" cy="18" rx="5" ry="3.5"/>
        <ellipse cx="-42" cy="22" rx="5.5" ry="4"/>
        <ellipse cx="-24" cy="24" rx="6" ry="4"/>
        <ellipse cx="0" cy="25" rx="6" ry="4"/>
        <ellipse cx="24" cy="24" rx="6" ry="4"/>
        <ellipse cx="42" cy="22" rx="5.5" ry="4"/>
        <ellipse cx="58" cy="18" rx="5" ry="3.5"/>
      </g>
    </g>

  </g>
</svg>
